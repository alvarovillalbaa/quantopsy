name: Quantopsy public GGUF observation 2
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: quantopsy-artifacts-20261107-2
  cancel-in-progress: false
jobs:
  public-gguf-observation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/qa/quantopsy-artifacts-20261107-2' &&
      github.repository == 'alvarovillalbaa/quantopsy' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      SOURCE_COMMIT: a604b0df2c176630ddcc8874477dea7e797ce01f
      QUANTOPSY_ARTIFACT_PUBLIC_REPOSITORY: 'true'
    steps:
      - name: Record earliest owned job step
        shell: bash
        run: echo "QUANTOPSY_ARTIFACT_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
          clean: false
      - name: Observe three pinned public containers with the existing CLI
        shell: bash
        run: python3 -I -B -S tests/scripts/run-public-gguf-observation.py --source-commit "$SOURCE_COMMIT"
