name: Quantopsy opt-in v2 compatibility
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: quantopsy-compat-v2-20261107-1
  cancel-in-progress: false
jobs:
  gguf-v2-compatibility:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/qa/quantopsy-compat-v2-20261107-1' &&
      github.repository == 'alvarovillalbaa/quantopsy' &&
      github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      SOURCE_COMMIT: e18dee0559949f0bbedba01da9c3006b228c44cd
      QUANTOPSY_ARTIFACT_PUBLIC_REPOSITORY: 'true'
    steps:
      - name: Record earliest owned job step
        shell: bash
        run: echo "QUANTOPSY_ARTIFACT_JOB_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 2
          persist-credentials: false
          clean: false
      - name: Check opt-in v2 fixtures and one explicit public-file restoration
        shell: bash
        run: python3 -I -B -S tests/scripts/run-public-gguf-v2-compatibility.py --source-commit "$SOURCE_COMMIT"
